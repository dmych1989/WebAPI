server:
  host: 127.0.0.1
  port: 18080
  api_key_enabled: false
  api_keys: []
  api_key_objects: []
proxy:
  timeout: 120
  retry_count: 3
  retry_delay: 5
load_balance:
  default_strategy: round_robin
  rate_limit_cooldown: 60
providers:
  deepseek:
    enabled: true
    accounts: []
  kimi:
    enabled: true
    accounts: []
  qwen:
    enabled: true
    accounts: []
  minimax:
    enabled: true
    accounts: []
  doubao:
    enabled: true
    accounts: []
  yuanbao:
    enabled: true
    accounts: []
  glm:
    enabled: true
    accounts: []
  coze:
    enabled: true
    accounts: []
  mimo:
    enabled: true
    accounts: []
model_mappings:
  '*deepseek*':
    provider: deepseek
    actual_model: null
  '*kimi*':
    provider: kimi
    actual_model: null
  '*qwen*':
    provider: qwen
    actual_model: null
  '*minimax*':
    provider: minimax
    actual_model: null
  '*abab*':
    provider: minimax
    actual_model: null
  '*doubao*':
    provider: doubao
    actual_model: null
  '*hunyuan*':
    provider: yuanbao
    actual_model: null
  '*yuanbao*':
    provider: yuanbao
    actual_model: null
  '*glm*':
    provider: glm
    actual_model: null
  '*coze*':
    provider: coze
    actual_model: null
  '*mimo*':
    provider: mimo
    actual_model: null
provider_fallback: {}
context_management:
  enabled: true
  max_messages: 50
  max_tokens: 128000
  strategy: sliding_window
tool_calling:
  enabled: true
  mode: prompt_engineering
logging:
  level: INFO
  file: logs/webapi.log
  max_size: 10MB
  retention: 7 days

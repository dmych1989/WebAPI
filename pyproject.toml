[project]
name = "webapi"
version = "0.1.0"
description = "网页版大模型对话转本地 OpenAI 兼容 API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
authors = [
    {name = "WebAPI Contributors"}
]
keywords = ["openai", "api", "llm", "proxy", "chatgpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "aiohttp>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "uuid7>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "black>=24.0",
    "ruff>=0.5",
]
browser = [
    "playwright>=1.48",
]
all = [
    "webapi[dev,browser]",
]

[project.scripts]
webapi = "src.main:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 排除手动集成脚本：需要运行中的服务（默认 18080），不应在 pytest 收集时执行
addopts = "--ignore=tests/test_e2e.py --ignore=tests/test_phase3.py --ignore=tests/test_phase4.py --ignore=tests/test_ds_auth.py --ignore=tests/test_ds_provider.py --ignore=tests/test_server_health.py"
markers = [
    "integration: 需要 WebAPI 服务运行后才能跑（手动执行脚本）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

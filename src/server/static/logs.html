<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志管理 - WebAPI</title>
<style>
/* 日志管理全局样式 */
:root {
  /* 主色调 */
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --secondary: #64748b;
  --accent: #06b6d4;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  
  /* 背景色 */
  --bg-primary: #ffffff;
  --bg-secondary: #f8fafc;
  --bg-tertiary: #f1f5f9;
  --bg-card: #ffffff;
  --bg-hover: #f8fafc;
  
  /* 文字色 */
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-tertiary: #94a3b8;
  
  /* 边框色 */
  --border-primary: #e2e8f0;
  --border-secondary: #cbd5e1;
  
  /* 阴影 */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  
  /* 动画 */
  --transition: all 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
}

/* 布局容器 */
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 20px;
}

/* 头部 */
.header {
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border-primary);
  padding: 20px 0;
  margin-bottom: 24px;
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
}

.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* 搜索和过滤 */
.search-filter {
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
}

.search-filter-row {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 300px;
  padding: 10px 16px;
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  font-size: 14px;
  transition: var(--transition);
}

.search-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.filter-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.filter-select {
  padding: 8px 12px;
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  font-size: 14px;
  background: var(--bg-primary);
  cursor: pointer;
}

/* 日志列表 */
.logs-container {
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: 12px;
  overflow: hidden;
}

.logs-header {
  padding: 20px;
  border-bottom: 1px solid var(--border-primary);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logs-stats {
  display: flex;
  gap: 20px;
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 16px;
  background: var(--bg-secondary);
  border-radius: 8px;
}

.stat-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}

.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
}

.logs-table {
  width: 100%;
  border-collapse: collapse;
}

.logs-table th {
  background: var(--bg-secondary);
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-primary);
  font-size: 14px;
}

.logs-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-primary);
  font-size: 14px;
}

.logs-table tr:hover {
  background: var(--bg-hover);
}

.log-level {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}

.log-level.info {
  background: rgba(59, 130, 246, 0.1);
  color: var(--primary);
}

.log-level.success {
  background: rgba(16, 185, 129, 0.1);
  color: var(--success);
}

.log-level.warning {
  background: rgba(245, 158, 11, 0.1);
  color: var(--warning);
}

.log-level.error {
  background: rgba(239, 68, 68, 0.1);
  color: var(--error);
}

.log-message {
  font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
  font-size: 13px;
  color: var(--text-primary);
  word-break: break-all;
}

.log-details {
  display: flex;
  gap: 8px;
  align-items: center;
}

.log-detail {
  font-size: 12px;
  color: var(--text-secondary);
}

/* 日志详情模态框 */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: var(--bg-primary);
  border-radius: 12px;
  padding: 24px;
  max-width: 800px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 4px;
}

.modal-close:hover {
  color: var(--text-primary);
}

.log-detail-view {
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}

.log-detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-primary);
}

.log-detail-row:last-child {
  border-bottom: none;
}

.log-detail-label {
  font-size: 14px;
  color: var(--text-secondary);
  font-weight: 500;
}

.log-detail-value {
  font-size: 14px;
  color: var(--text-primary);
  font-weight: 600;
}

.log-message-full {
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  padding: 16px;
  font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
  font-size: 13px;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 400px;
  overflow-y: auto;
}

/* 分页 */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 20px;
  border-top: 1px solid var(--border-primary);
}

.pagination-btn {
  padding: 8px 12px;
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  background: var(--bg-primary);
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
}

.pagination-btn:hover {
  background: var(--bg-secondary);
}

.pagination-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.pagination-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* 按钮样式 */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--bg-secondary);
  color: var(--text-primary);
  border: 1px solid var(--border-primary);
}

.btn-secondary:hover {
  background: var(--bg-tertiary);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
}

/* 加载动画 */
.loading {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--border-primary);
  border-top: 2px solid var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Toast 通知 */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1001;
}

.toast {
  background: var(--bg-card);
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideIn 0.3s ease;
}

.toast.success {
  border-left: 4px solid var(--success);
}

.toast.error {
  border-left: 4px solid var(--error);
}

.toast.warning {
  border-left: 4px solid var(--warning);
}

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* 响应式设计 */
@media (max-width: 768px) {
  .logs-table {
    font-size: 12px;
  }
  
  .logs-table th,
  .logs-table td {
    padding: 8px 12px;
  }
  
  .search-filter-row {
    flex-direction: column;
    align-items: stretch;
  }
  
  .search-input {
    min-width: 100%;
  }
  
  .logs-stats {
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .stat-item {
    flex-direction: row;
    gap: 8px;
  }
}
</style>
</head>
<body>
<div class="header">
  <div class="container">
    <div class="header-content">
      <div class="header-title">日志管理</div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="refreshLogs()">
          🔄 刷新
        </button>
        <button class="btn btn-secondary" onclick="exportLogs()">
          📥 导出
        </button>
        <button class="btn btn-primary" onclick="clearLogs()">
          🗑️ 清空
        </button>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <!-- 搜索和过滤 -->
  <div class="search-filter">
    <div class="search-filter-row">
      <input type="text" class="search-input" placeholder="搜索日志..." id="searchInput" onkeyup="filterLogs()">
      <div class="filter-group">
        <label class="form-label">日志级别:</label>
        <select class="filter-select" id="levelFilter" onchange="filterLogs()">
          <option value="all">全部</option>
          <option value="info">信息</option>
          <option value="success">成功</option>
          <option value="warning">警告</option>
          <option value="error">错误</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="form-label">时间范围:</label>
        <select class="filter-select" id="timeFilter" onchange="filterLogs()">
          <option value="all">全部</option>
          <option value="1h">最近1小时</option>
          <option value="24h">最近24小时</option>
          <option value="7d">最近7天</option>
          <option value="30d">最近30天</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 日志列表 -->
  <div class="logs-container">
    <div class="logs-header">
      <div class="logs-stats">
        <div class="stat-item">
          <div class="stat-value" id="totalLogs">0</div>
          <div class="stat-label">总日志数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="errorLogs">0</div>
          <div class="stat-label">错误日志</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="warningLogs">0</div>
          <div class="stat-label">警告日志</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="successLogs">0</div>
          <div class="stat-label">成功日志</div>
        </div>
      </div>
      <div class="logs-actions">
        <button class="btn btn-sm btn-secondary" onclick="toggleAutoRefresh()">
          <span id="autoRefreshIcon">▶️</span>
          <span id="autoRefreshText">自动刷新</span>
        </button>
      </div>
    </div>
    
    <table class="logs-table">
      <thead>
        <tr>
          <th>时间</th>
          <th>级别</th>
          <th>来源</th>
          <th>消息</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="logsTableBody">
        <!-- 日志行将通过JavaScript动态生成 -->
      </tbody>
    </table>
    
    <div class="pagination">
      <button class="pagination-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
      <span class="pagination-btn active" id="pageInfo">第 1 页</span>
      <button class="pagination-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
    </div>
  </div>
</div>

<!-- 日志详情模态框 -->
<div class="modal" id="logDetailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">日志详情</h2>
      <button class="modal-close" onclick="closeModal('logDetailModal')">&times;</button>
    </div>
    <div id="logDetailContent">
      <!-- 日志详情将通过JavaScript动态生成 -->
    </div>
  </div>
</div>

<!-- Toast容器 -->
<div class="toast-container" id="toastContainer"></div>

<script>
// 日志管理器
const LogManager = {
  data: {
    logs: [],
    filteredLogs: [],
    currentPage: 1,
    pageSize: 20,
    totalPages: 1,
    isLoading: false,
    autoRefresh: false,
    refreshInterval: null
  },

  async loadLogs() {
    this.isLoading = true;
    try {
      const response = await fetch('/api/logs');
      const data = await response.json();
      
      this.data.logs = data.logs || [
        {
          id: 'log_001',
          timestamp: '2024-01-20 14:30:15',
          level: 'info',
          source: 'system',
          message: '系统启动成功',
          details: {
            service: 'WebAPI',
            version: '1.0.0',
            uptime: '5m 32s'
          }
        },
        {
          id: 'log_002',
          timestamp: '2024-01-20 14:30:16',
          level: 'success',
          source: 'provider',
          message: 'Provider验证成功: DeepSeek',
          details: {
            provider: 'deepseek',
            responseTime: '245ms',
            accounts: 1
          }
        },
        {
          id: 'log_003',
          timestamp: '2024-01-20 14:30:18',
          level: 'success',
          source: 'provider',
          message: 'Provider验证成功: Kimi',
          details: {
            provider: 'kimi',
            responseTime: '189ms',
            accounts: 1
          }
        },
        {
          id: 'log_004',
          timestamp: '2024-01-20 14:30:20',
          level: 'warning',
          source: 'provider',
          message: 'Provider响应超时: Doubao',
          details: {
            provider: 'doubao',
            timeout: '30000ms',
            retry: 3
          }
        },
        {
          id: 'log_005',
          timestamp: '2024-01-20 14:30:25',
          level: 'error',
          source: 'api',
          message: 'API请求失败: 500 Internal Server Error',
          details: {
            endpoint: '/v1/chat/completions',
            method: 'POST',
            status: 500,
            error: 'Internal server error'
          }
        },
        {
          id: 'log_006',
          timestamp: '2024-01-20 14:30:30',
          level: 'info',
          source: 'system',
          message: '健康检查完成',
          details: {
            checked: 6,
            healthy: 5,
            unhealthy: 1,
            duration: '2.3s'
          }
        },
        {
          id: 'log_007',
          timestamp: '2024-01-20 14:30:35',
          level: 'success',
          source: 'account',
          message: '账号使用统计更新',
          details: {
            totalRequests: 12500,
            successRate: '98.5%',
            avgResponseTime: '245ms'
          }
        },
        {
          id: 'log_008',
          timestamp: '2024-01-20 14:30:40',
          level: 'info',
          source: 'system',
          message: '配置重载完成',
          details: {
            config: 'server.yaml',
            timestamp: '2024-01-20 14:30:40',
            success: true
          }
        }
      ];
      
      this.data.filteredLogs = [...this.data.logs];
      this.updatePagination();
      this.renderLogs();
      this.updateStats();
    } catch (error) {
      console.error('加载日志数据失败:', error);
      this.loadMockData();
    } finally {
      this.isLoading = false;
    }
  },

  loadMockData() {
    this.data.logs = [
      {
        id: 'log_001',
        timestamp: '2024-01-20 14:30:15',
        level: 'info',
        source: 'system',
        message: '系统启动成功',
        details: {
          service: 'WebAPI',
          version: '1.0.0',
          uptime: '5m 32s'
        }
      },
      {
        id: 'log_002',
        timestamp: '2024-01-20 14:30:16',
        level: 'success',
        source: 'provider',
        message: 'Provider验证成功: DeepSeek',
        details: {
          provider: 'deepseek',
          responseTime: '245ms',
          accounts: 1
        }
      },
      {
        id: 'log_003',
        timestamp: '2024-01-20 14:30:18',
        level: 'success',
        source: 'provider',
        message: 'Provider验证成功: Kimi',
        details: {
          provider: 'kimi',
          responseTime: '189ms',
          accounts: 1
        }
      },
      {
        id: 'log_004',
        timestamp: '2024-01-20 14:30:20',
        level: 'warning',
        source: 'provider',
        message: 'Provider响应超时: Doubao',
        details: {
          provider: 'doubao',
          timeout: '30000ms',
          retry: 3
        }
      },
      {
        id: 'log_005',
        timestamp: '2024-01-20 14:30:25',
        level: 'error',
        source: 'api',
        message: 'API请求失败: 500 Internal Server Error',
        details: {
          endpoint: '/v1/chat/completions',
          method: 'POST',
          status: 500,
          error: 'Internal server error'
        }
      },
      {
        id: 'log_006',
        timestamp: '2024-01-20 14:30:30',
        level: 'info',
        source: 'system',
        message: '健康检查完成',
        details: {
          checked: 6,
          healthy: 5,
          unhealthy: 1,
          duration: '2.3s'
        }
      },
      {
        id: 'log_007',
        timestamp: '2024-01-20 14:30:35',
        level: 'success',
        source: 'account',
        message: '账号使用统计更新',
        details: {
          totalRequests: 12500,
          successRate: '98.5%',
          avgResponseTime: '245ms'
        }
      },
      {
        id: 'log_008',
        timestamp: '2024-01-20 14:30:40',
        level: 'info',
        source: 'system',
        message: '配置重载完成',
        details: {
          config: 'server.yaml',
          timestamp: '2024-01-20 14:30:40',
          success: true
        }
      }
    ];
    
    this.data.filteredLogs = [...this.data.logs];
    this.updatePagination();
    this.renderLogs();
    this.updateStats();
  },

  updatePagination() {
    this.data.totalPages = Math.ceil(this.data.filteredLogs.length / this.data.pageSize);
    this.data.currentPage = Math.min(this.data.currentPage, this.data.totalPages);
    
    document.getElementById('pageInfo').textContent = `第 ${this.data.currentPage} 页`;
    document.getElementById('prevBtn').disabled = this.data.currentPage <= 1;
    document.getElementById('nextBtn').disabled = this.data.currentPage >= this.data.totalPages;
  },

  renderLogs() {
    const tbody = document.getElementById('logsTableBody');
    tbody.innerHTML = '';
    
    const startIndex = (this.data.currentPage - 1) * this.data.pageSize;
    const endIndex = startIndex + this.data.pageSize;
    const pageLogs = this.data.filteredLogs.slice(startIndex, endIndex);
    
    pageLogs.forEach(log => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${log.timestamp}</td>
        <td>
          <span class="log-level ${log.level}">
            ${log.level === 'info' ? 'ℹ️' : log.level === 'success' ? '✅' : log.level === 'warning' ? '⚠️' : '❌'}
            ${log.level === 'info' ? '信息' : log.level === 'success' ? '成功' : log.level === 'warning' ? '警告' : '错误'}
          </span>
        </td>
        <td>${log.source}</td>
        <td>
          <div class="log-message">${log.message}</div>
        </td>
        <td>
          <button class="btn btn-sm btn-primary" onclick="showLogDetail('${log.id}')">
            详情
          </button>
        </td>
      `;
      tbody.appendChild(row);
    });
  },

  updateStats() {
    const totalLogs = this.data.logs.length;
    const errorLogs = this.data.logs.filter(log => log.level === 'error').length;
    const warningLogs = this.data.logs.filter(log => log.level === 'warning').length;
    const successLogs = this.data.logs.filter(log => log.level === 'success').length;
    
    document.getElementById('totalLogs').textContent = totalLogs;
    document.getElementById('errorLogs').textContent = errorLogs;
    document.getElementById('warningLogs').textContent = warningLogs;
    document.getElementById('successLogs').textContent = successLogs;
  },

  filterLogs() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const levelFilter = document.getElementById('levelFilter').value;
    const timeFilter = document.getElementById('timeFilter').value;
    
    this.data.filteredLogs = this.data.logs.filter(log => {
      const matchesSearch = log.message.toLowerCase().includes(searchTerm) ||
                           log.source.toLowerCase().includes(searchTerm);
      const matchesLevel = levelFilter === 'all' || log.level === levelFilter;
      const matchesTime = timeFilter === 'all' || this.checkTimeFilter(log.timestamp, timeFilter);
      
      return matchesSearch && matchesLevel && matchesTime;
    });
    
    this.data.currentPage = 1;
    this.updatePagination();
    this.renderLogs();
  },

  checkTimeFilter(timestamp, filter) {
    const logDate = new Date(timestamp);
    const now = new Date();
    const diffMs = now - logDate;
    
    switch (filter) {
      case '1h':
        return diffMs <= 60 * 60 * 1000;
      case '24h':
        return diffMs <= 24 * 60 * 60 * 1000;
      case '7d':
        return diffMs <= 7 * 24 * 60 * 60 * 1000;
      case '30d':
        return diffMs <= 30 * 24 * 60 * 60 * 1000;
      default:
        return true;
    }
  },

  changePage(direction) {
    this.data.currentPage += direction;
    this.updatePagination();
    this.renderLogs();
  },

  toggleAutoRefresh() {
    this.data.autoRefresh = !this.data.autoRefresh;
    
    const icon = document.getElementById('autoRefreshIcon');
    const text = document.getElementById('autoRefreshText');
    
    if (this.data.autoRefresh) {
      icon.textContent = '⏸️';
      text.textContent = '停止刷新';
      this.data.refreshInterval = setInterval(() => {
        this.loadLogs();
      }, 5000);
    } else {
      icon.textContent = '▶️';
      text.textContent = '自动刷新';
      if (this.data.refreshInterval) {
        clearInterval(this.data.refreshInterval);
        this.data.refreshInterval = null;
      }
    }
  },

  async clearLogs() {
    if (confirm('确定要清空所有日志吗？')) {
      try {
        const response = await fetch('/api/logs', {
          method: 'DELETE'
        });
        
        if (response.ok) {
          showToast('日志已清空', 'success');
          this.loadLogs();
        } else {
          showToast('清空日志失败', 'error');
        }
      } catch (error) {
        console.error('清空日志失败:', error);
        showToast('清空日志失败', 'error');
      }
    }
  },

  async exportLogs() {
    try {
      const response = await fetch('/api/logs/export');
      const blob = await response.blob();
      
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `logs_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
      
      showToast('日志导出成功', 'success');
    } catch (error) {
      console.error('导出日志失败:', error);
      showToast('导出日志失败', 'error');
    }
  }
};

// 工具函数
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span>
    <span>${message}</span>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function showLogDetail(logId) {
  const log = LogManager.data.logs.find(l => l.id === logId);
  if (!log) return;
  
  const modal = document.getElementById('logDetailModal');
  const content = document.getElementById('logDetailContent');
  
  content.innerHTML = `
    <div class="log-detail-view">
      <div class="log-detail-row">
        <span class="log-detail-label">日志ID</span>
        <span class="log-detail-value">${log.id}</span>
      </div>
      <div class="log-detail-row">
        <span class="log-detail-label">时间</span>
        <span class="log-detail-value">${log.timestamp}</span>
      </div>
      <div class="log-detail-row">
        <span class="log-detail-label">级别</span>
        <span class="log-detail-value">
          <span class="log-level ${log.level}">
            ${log.level === 'info' ? 'ℹ️' : log.level === 'success' ? '✅' : log.level === 'warning' ? '⚠️' : '❌'}
            ${log.level === 'info' ? '信息' : log.level === 'success' ? '成功' : log.level === 'warning' ? '警告' : '错误'}
          </span>
        </span>
      </div>
      <div class="log-detail-row">
        <span class="log-detail-label">来源</span>
        <span class="log-detail-value">${log.source}</span>
      </div>
    </div>
    
    <div class="log-detail-view">
      <div class="log-detail-row">
        <span class="log-detail-label">消息</span>
        <span class="log-detail-value">${log.message}</span>
      </div>
    </div>
    
    <div class="log-detail-view">
      <div class="log-detail-row">
        <span class="log-detail-label">详细信息</span>
        <span class="log-detail-value">${JSON.stringify(log.details, null, 2)}</span>
      </div>
    </div>
  `;
  
  modal.classList.add('active');
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

function refreshLogs() {
  LogManager.loadLogs();
  showToast('日志列表已刷新', 'success');
}

function filterLogs() {
  LogManager.filterLogs();
}

function changePage(direction) {
  LogManager.changePage(direction);
}

function toggleAutoRefresh() {
  LogManager.toggleAutoRefresh();
}

function clearLogs() {
  LogManager.clearLogs();
}

function exportLogs() {
  LogManager.exportLogs();
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  LogManager.loadLogs();
});
</script>

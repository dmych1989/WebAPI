<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider管理 - WebAPI</title>
<style>
/* Provider管理全局样式 */
:root {
  /* 主色调 */
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --secondary: #64748b;
  --accent: #06b6d4;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  
  /* 背景色 */
  --bg-primary: #ffffff;
  --bg-secondary: #f8fafc;
  --bg-tertiary: #f1f5f9;
  --bg-card: #ffffff;
  --bg-hover: #f8fafc;
  
  /* 文字色 */
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-tertiary: #94a3b8;
  
  /* 边框色 */
  --border-primary: #e2e8f0;
  --border-secondary: #cbd5e1;
  
  /* 阴影 */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  
  /* 动画 */
  --transition: all 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
}

/* 布局容器 */
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 20px;
}

/* 头部 */
.header {
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border-primary);
  padding: 20px 0;
  margin-bottom: 24px;
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
}

.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* 搜索和过滤 */
.search-filter {
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
}

.search-filter-row {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 300px;
  padding: 10px 16px;
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  font-size: 14px;
  transition: var(--transition);
}

.search-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.filter-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.filter-select {
  padding: 8px 12px;
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  font-size: 14px;
  background: var(--bg-primary);
  cursor: pointer;
}

/* Provider网格 */
.provider-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}

.provider-card {
  background: var(--bg-card);
  border: 1px solid var(--border-primary);
  border-radius: 12px;
  padding: 24px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.provider-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.provider-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transform: scaleX(0);
  transition: transform 0.3s ease;
}

.provider-card:hover::before {
  transform: scaleX(1);
}

.provider-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}

.provider-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-right: 16px;
}

.provider-info {
  flex: 1;
}

.provider-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.provider-type {
  font-size: 12px;
  color: var(--text-secondary);
  padding: 2px 8px;
  background: var(--bg-secondary);
  border-radius: 12px;
  display: inline-block;
}

.provider-status {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.provider-status.healthy {
  background: rgba(16, 185, 129, 0.1);
  color: var(--success);
}

.provider-status.unhealthy {
  background: rgba(239, 68, 68, 0.1);
  color: var(--error);
}

.provider-status.disabled {
  background: rgba(107, 114, 128, 0.1);
  color: var(--secondary);
}

.provider-details {
  margin-bottom: 20px;
}

.provider-detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-primary);
}

.provider-detail-row:last-child {
  border-bottom: none;
}

.provider-detail-label {
  font-size: 14px;
  color: var(--text-secondary);
}

.provider-detail-value {
  font-size: 14px;
  color: var(--text-primary);
  font-weight: 500;
}

.provider-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* 按钮样式 */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--bg-secondary);
  color: var(--text-primary);
  border: 1px solid var(--border-primary);
}

.btn-secondary:hover {
  background: var(--bg-tertiary);
}

.btn-success {
  background: var(--success);
  color: white;
}

.btn-success:hover {
  background: #059669;
}

.btn-danger {
  background: var(--error);
  color: white;
}

.btn-danger:hover {
  background: #dc2626;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
}

.btn-icon {
  padding: 6px;
  border-radius: 6px;
  min-width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* 模态框 */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: var(--bg-primary);
  border-radius: 12px;
  padding: 24px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 4px;
}

.modal-close:hover {
  color: var(--text-primary);
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.form-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  font-size: 14px;
  transition: var(--transition);
}

.form-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.form-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  font-size: 14px;
  resize: vertical;
  min-height: 100px;
}

.form-select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  font-size: 14px;
  background: var(--bg-primary);
  cursor: pointer;
}

.form-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-checkbox input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
}

/* 加载动画 */
.loading {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--border-primary);
  border-top: 2px solid var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Toast 通知 */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1001;
}

.toast {
  background: var(--bg-card);
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideIn 0.3s ease;
}

.toast.success {
  border-left: 4px solid var(--success);
}

.toast.error {
  border-left: 4px solid var(--error);
}

.toast.warning {
  border-left: 4px solid var(--warning);
}

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* 响应式设计 */
@media (max-width: 768px) {
  .provider-grid {
    grid-template-columns: 1fr;
  }
  
  .search-filter-row {
    flex-direction: column;
    align-items: stretch;
  }
  
  .search-input {
    min-width: 100%;
  }
  
  .provider-actions {
    flex-direction: column;
  }
  
  .btn {
    width: 100%;
    justify-content: center;
  }
}
</style>
</head>
<body>
<div class="header">
  <div class="container">
    <div class="header-content">
      <div class="header-title">Provider管理</div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="showAddProviderModal()">
          ➕ 添加Provider
        </button>
        <button class="btn btn-secondary" onclick="refreshProviders()">
          🔄 刷新
        </button>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <!-- 搜索和过滤 -->
  <div class="search-filter">
    <div class="search-filter-row">
      <input type="text" class="search-input" placeholder="搜索Provider..." id="searchInput" onkeyup="filterProviders()">
      <div class="filter-group">
        <label class="form-label">状态:</label>
        <select class="filter-select" id="statusFilter" onchange="filterProviders()">
          <option value="all">全部</option>
          <option value="healthy">健康</option>
          <option value="unhealthy">异常</option>
          <option value="disabled">禁用</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="form-label">类型:</label>
        <select class="filter-select" id="typeFilter" onchange="filterProviders()">
          <option value="all">全部</option>
          <option value="builtin">内置</option>
          <option value="custom">自定义</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Provider网格 -->
  <div class="provider-grid" id="providerGrid">
    <!-- Provider卡片将通过JavaScript动态生成 -->
  </div>
</div>

<!-- 添加Provider模态框 -->
<div class="modal" id="addProviderModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">添加Provider</h2>
      <button class="modal-close" onclick="closeModal('addProviderModal')">&times;</button>
    </div>
    <form id="addProviderForm">
      <div class="form-group">
        <label class="form-label">Provider类型</label>
        <select class="form-select" id="providerType" required>
          <option value="">选择Provider类型</option>
          <option value="deepseek">DeepSeek</option>
          <option value="kimi">Kimi</option>
          <option value="qwen">通义千问</option>
          <option value="minimax">MiniMax</option>
          <option value="doubao">豆包</option>
          <option value="yuanbao">元宝</option>
          <option value="glm">GLM</option>
          <option value="coze">Coze</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Provider名称</label>
        <input type="text" class="form-input" id="providerName" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">API Key</label>
        <input type="text" class="form-input" id="apiKey" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Base URL</label>
        <input type="text" class="form-input" id="baseUrl">
      </div>
      
      <div class="form-group">
        <label class="form-label">并发数限制</label>
        <input type="number" class="form-input" id="concurrentLimit" value="10" min="1">
      </div>
      
      <div class="form-group">
        <label class="form-label">启用状态</label>
        <div class="form-checkbox">
          <input type="checkbox" id="enabled" checked>
          <label for="enabled">启用此Provider</label>
        </div>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal('addProviderModal')">取消</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast容器 -->
<div class="toast-container" id="toastContainer"></div>

<script>
// Provider管理器
const ProviderManager = {
  data: {
    providers: [],
    filteredProviders: [],
    isLoading: false
  },

  async loadProviders() {
    this.isLoading = true;
    try {
      const response = await fetch('/api/providers');
      const data = await response.json();
      
      this.data.providers = data.providers || [
        {
          id: 'deepseek',
          name: 'DeepSeek',
          type: 'builtin',
          icon: '🐳',
          status: 'healthy',
          enabled: true,
          accounts: 1,
          concurrent: 0,
          concurrentLimit: 10,
          lastVerified: '2分钟前',
          responseTime: '245ms',
          apiKey: 'sk-xxxxxxx',
          baseUrl: 'https://api.deepseek.com'
        },
        {
          id: 'kimi',
          name: 'Kimi',
          type: 'builtin',
          icon: '🌙',
          status: 'healthy',
          enabled: true,
          accounts: 1,
          concurrent: 0,
          concurrentLimit: 10,
          lastVerified: '5分钟前',
          responseTime: '189ms',
          apiKey: 'sk-xxxxxxx',
          baseUrl: 'https://api.moonshot.cn'
        },
        {
          id: 'qwen',
          name: '通义千问',
          type: 'builtin',
          icon: '☁️',
          status: 'healthy',
          enabled: true,
          accounts: 1,
          concurrent: 0,
          concurrentLimit: 10,
          lastVerified: '1分钟前',
          responseTime: '312ms',
          apiKey: 'sk-xxxxxxx',
          baseUrl: 'https://dashscope.aliyuncs.com'
        },
        {
          id: 'doubao',
          name: '豆包',
          type: 'builtin',
          icon: '🫘',
          status: 'unhealthy',
          enabled: true,
          accounts: 1,
          concurrent: 0,
          concurrentLimit: 10,
          lastVerified: '10分钟前',
          responseTime: 'timeout',
          apiKey: 'sk-xxxxxxx',
          baseUrl: 'https://ark.cn-beijing.volces.com'
        },
        {
          id: 'custom',
          name: '自定义Provider',
          type: 'custom',
          icon: '⚙️',
          status: 'healthy',
          enabled: true,
          accounts: 1,
          concurrent: 0,
          concurrentLimit: 5,
          lastVerified: '刚刚',
          responseTime: '156ms',
          apiKey: 'sk-xxxxxxx',
          baseUrl: 'https://api.example.com'
        }
      ];
      
      this.data.filteredProviders = [...this.data.providers];
      this.renderProviders();
    } catch (error) {
      console.error('加载Provider数据失败:', error);
      this.loadMockData();
    } finally {
      this.isLoading = false;
    }
  },

  loadMockData() {
    this.data.providers = [
      {
        id: 'deepseek',
        name: 'DeepSeek',
        type: 'builtin',
        icon: '🐳',
        status: 'healthy',
        enabled: true,
        accounts: 1,
        concurrent: 0,
        concurrentLimit: 10,
        lastVerified: '2分钟前',
        responseTime: '245ms',
        apiKey: 'sk-xxxxxxx',
        baseUrl: 'https://api.deepseek.com'
      },
      {
        id: 'kimi',
        name: 'Kimi',
        type: 'builtin',
        icon: '🌙',
        status: 'healthy',
        enabled: true,
        accounts: 1,
        concurrent: 0,
        concurrentLimit: 10,
        lastVerified: '5分钟前',
        responseTime: '189ms',
        apiKey: 'sk-xxxxxxx',
        baseUrl: 'https://api.moonshot.cn'
      },
      {
        id: 'qwen',
        name: '通义千问',
        type: 'builtin',
        icon: '☁️',
        status: 'healthy',
        enabled: true,
        accounts: 1,
        concurrent: 0,
        concurrentLimit: 10,
        lastVerified: '1分钟前',
        responseTime: '312ms',
        apiKey: 'sk-xxxxxxx',
        baseUrl: 'https://dashscope.aliyuncs.com'
      },
      {
        id: 'doubao',
        name: '豆包',
        type: 'builtin',
        icon: '🫘',
        status: 'unhealthy',
        enabled: true,
        accounts: 1,
        concurrent: 0,
        concurrentLimit: 10,
        lastVerified: '10分钟前',
        responseTime: 'timeout',
        apiKey: 'sk-xxxxxxx',
        baseUrl: 'https://ark.cn-beijing.volces.com'
      },
      {
        id: 'custom',
        name: '自定义Provider',
        type: 'custom',
        icon: '⚙️',
        status: 'healthy',
        enabled: true,
        accounts: 1,
        concurrent: 0,
        concurrentLimit: 5,
        lastVerified: '刚刚',
        responseTime: '156ms',
        apiKey: 'sk-xxxxxxx',
        baseUrl: 'https://api.example.com'
      }
    ];
    
    this.data.filteredProviders = [...this.data.providers];
    this.renderProviders();
  },

  renderProviders() {
    const grid = document.getElementById('providerGrid');
    grid.innerHTML = '';
    
    this.data.filteredProviders.forEach(provider => {
      const card = document.createElement('div');
      card.className = 'provider-card';
      card.innerHTML = `
        <div class="provider-header">
          <div style="display: flex; align-items: center;">
            <div class="provider-icon">${provider.icon}</div>
            <div class="provider-info">
              <div class="provider-name">${provider.name}</div>
              <div class="provider-type">${provider.type === 'builtin' ? '内置' : '自定义'}</div>
            </div>
          </div>
          <div class="provider-status ${provider.status}">
            ${provider.status === 'healthy' ? '✅' : provider.status === 'unhealthy' ? '❌' : '⚪'}
            ${provider.status === 'healthy' ? '健康' : provider.status === 'unhealthy' ? '异常' : '禁用'}
          </div>
        </div>
        
        <div class="provider-details">
          <div class="provider-detail-row">
            <span class="provider-detail-label">账号数量</span>
            <span class="provider-detail-value">${provider.accounts}</span>
          </div>
          <div class="provider-detail-row">
            <span class="provider-detail-label">当前并发</span>
            <span class="provider-detail-value">${provider.concurrent}/${provider.concurrentLimit}</span>
          </div>
          <div class="provider-detail-row">
            <span class="provider-detail-label">响应时间</span>
            <span class="provider-detail-value">${provider.responseTime}</span>
          </div>
          <div class="provider-detail-row">
            <span class="provider-detail-label">最后验证</span>
            <span class="provider-detail-value">${provider.lastVerified}</span>
          </div>
          <div class="provider-detail-row">
            <span class="provider-detail-label">状态</span>
            <span class="provider-detail-value">${provider.enabled ? '启用' : '禁用'}</span>
          </div>
        </div>
        
        <div class="provider-actions">
          <button class="btn btn-sm btn-primary" onclick="verifyProvider('${provider.id}')">
            🔄 验证
          </button>
          <button class="btn btn-sm btn-secondary" onclick="editProvider('${provider.id}')">
            ✏️ 编辑
          </button>
          <button class="btn btn-sm btn-secondary" onclick="viewProvider('${provider.id}')">
            👁️ 详情
          </button>
          <button class="btn btn-sm ${provider.enabled ? 'btn-warning' : 'btn-success'}" onclick="toggleProvider('${provider.id}')">
            ${provider.enabled ? '⏸️ 禁用' : '▶️ 启用'}
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteProvider('${provider.id}')">
            🗑️ 删除
          </button>
        </div>
      `;
      grid.appendChild(card);
    });
  },

  filterProviders() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('statusFilter').value;
    const typeFilter = document.getElementById('typeFilter').value;
    
    this.data.filteredProviders = this.data.providers.filter(provider => {
      const matchesSearch = provider.name.toLowerCase().includes(searchTerm) ||
                           provider.id.toLowerCase().includes(searchTerm);
      const matchesStatus = statusFilter === 'all' || provider.status === statusFilter;
      const matchesType = typeFilter === 'all' || provider.type === typeFilter;
      
      return matchesSearch && matchesStatus && matchesType;
    });
    
    this.renderProviders();
  },

  async addProvider(formData) {
    try {
      const response = await fetch('/api/providers', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(formData),
      });
      
      if (response.ok) {
        showToast('Provider添加成功', 'success');
        this.loadProviders();
        closeModal('addProviderModal');
      } else {
        showToast('Provider添加失败', 'error');
      }
    } catch (error) {
      console.error('添加Provider失败:', error);
      showToast('Provider添加失败', 'error');
    }
  }
};

// 工具函数
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span>
    <span>${message}</span>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function showAddProviderModal() {
  document.getElementById('addProviderModal').classList.add('active');
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

function refreshProviders() {
  ProviderManager.loadProviders();
  showToast('Provider列表已刷新', 'success');
}

function filterProviders() {
  ProviderManager.filterProviders();
}

function verifyProvider(id) {
  showToast(`正在验证 ${id}...`, 'info');
  setTimeout(() => {
    showToast(`${id} 验证成功`, 'success');
  }, 2000);
}

function editProvider(id) {
  showToast(`编辑 ${id} 配置`, 'info');
}

function viewProvider(id) {
  showToast(`查看 ${id} 详情`, 'info');
}

function toggleProvider(id) {
  showToast(`切换 ${id} 状态`, 'info');
}

function deleteProvider(id) {
  if (confirm(`确定要删除 ${id} 吗？`)) {
    showToast(`删除 ${id}`, 'info');
  }
}

// 表单提交
document.getElementById('addProviderForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const formData = {
    type: document.getElementById('providerType').value,
    name: document.getElementById('providerName').value,
    apiKey: document.getElementById('apiKey').value,
    baseUrl: document.getElementById('baseUrl').value,
    concurrentLimit: parseInt(document.getElementById('concurrentLimit').value),
    enabled: document.getElementById('enabled').checked
  };
  
  ProviderManager.addProvider(formData);
});

// 点击模态框外部关闭
document.getElementById('addProviderModal').addEventListener('click', function(e) {
  if (e.target === this) {
    closeModal('addProviderModal');
  }
});

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  ProviderManager.loadProviders();
});
</script>

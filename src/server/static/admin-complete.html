<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAPI Admin Console - 完整功能版</title>
<style>
  /* ============================================================
   * 现代化主题设计 - 完整功能版
   * ============================================================ */

  :root,
  html[data-theme="dark"] {
    /* 主色调 - 现代渐变色 */
    --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    
    /* 基础颜色 */
    --bg: #0a0a0f;
    --bg-secondary: #141418;
    --bg-tertiary: #1f1f25;
    --bg-card: rgba(255, 255, 255, 0.03);
    --bg-card-hover: rgba(255, 255, 255, 0.05);
    
    /* 边框和分隔线 */
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.2);
    
    /* 文字颜色 */
    --text-primary: #ffffff;
    --text-secondary: #a0a0b0;
    --text-tertiary: #808090;
    
    /* 状态颜色 */
    --success: #4ade80;
    --success-bg: rgba(74, 222, 128, 0.1);
    --warning: #fbbf24;
    --warning-bg: rgba(251, 191, 36, 0.1);
    --error: #f87171;
    --error-bg: rgba(248, 113, 113, 0.1);
    --info: #60a5fa;
    --info-bg: rgba(96, 165, 250, 0.1);
    
    /* 品牌色 */
    --primary: #667eea;
    --primary-hover: #5a67d8;
    --secondary: #764ba2;
    --accent: #f093fb;
    
    /* 阴影 */
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 20px rgba(102, 126, 234, 0.3);
    
    /* 动画 */
    --transition-fast: 0.15s ease;
    --transition-normal: 0.3s ease;
    --transition-slow: 0.5s ease;
    
    /* 滚动条 */
    --scrollbar-thumb: rgba(255, 255, 255, 0.2);
    --scrollbar-track: transparent;
  }

  html[data-theme="light"] {
    --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --secondary-gradient: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
    --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
    
    --bg: #f8fafc;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f1f5f9;
    --bg-card: rgba(0, 0, 0, 0.02);
    --bg-card-hover: rgba(0, 0, 0, 0.04);
    
    --border: rgba(0, 0, 0, 0.1);
    --border-strong: rgba(0, 0, 0, 0.2);
    
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-tertiary: #94a3b8;
    
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.15);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.2);
    --shadow-glow: 0 0 20px rgba(79, 70, 229, 0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { transition: background 0.3s ease, color 0.3s ease; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }

  .container { max-width: 1200px; margin: auto; padding: 24px; }

  /* 头部样式 */
  header {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-md);
    transition: all var(--transition-normal);
  }

  header:hover {
    box-shadow: var(--shadow-lg);
    border-color: var(--primary);
  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header .ver {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  /* 主题切换按钮 */
  .theme-toggle {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    width: 44px;
    height: 44px;
    border-radius: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all var(--transition-fast);
    position: relative;
    overflow: hidden;
  }

  .theme-toggle::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--primary-gradient);
    opacity: 0;
    transition: opacity var(--transition-fast);
    border-radius: 12px;
  }

  .theme-toggle:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .theme-toggle:hover::before {
    opacity: 0.1;
  }

  .theme-toggle .icon-sun,
  .theme-toggle .icon-moon,
  .theme-toggle .icon-system { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: inline; }
  html[data-theme="light"] .theme-toggle .icon-sun { display: inline; }

  /* 状态卡片 */
  .status-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .status-chip {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: all var(--transition-normal);
    position: relative;
    overflow: hidden;
  }

  .status-chip::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--primary-gradient);
    transform: scaleX(0);
    transition: transform var(--transition-fast);
  }

  .status-chip:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .status-chip:hover::before {
    transform: scaleX(1);
  }

  .status-chip .label {
    font-size: 12px;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .status-chip .value {
    font-size: 24px;
    font-weight: 700;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .status-chip .value.ok { color: var(--success); }
  .status-chip .value.warn { color: var(--warning); }
  .status-chip .value.err { color: var(--error); }

  /* 按钮样式 */
  .btn {
    background: var(--primary-gradient);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all var(--transition-fast);
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.2);
    transform: translateX(-100%);
    transition: transform var(--transition-fast);
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn:hover::before {
    transform: translateX(0);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-secondary {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  .btn-danger {
    background: var(--error);
    color: white;
  }

  .btn-success {
    background: var(--success);
    color: white;
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 12px;
  }

  /* 卡片样式 */
  .section {
    margin-bottom: 32px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title .icon {
    width: 24px;
    height: 24px;
    background: var(--primary-gradient);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
  }

  .card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
    transition: all var(--transition-normal);
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary);
  }

  /* 表格样式 */
  table {
    width: 100%;
    border-collapse: collapse;
    background: transparent;
  }

  th {
    text-align: left;
    padding: 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:hover td {
    background: var(--bg-card-hover);
  }

  /* 徽章样式 */
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    backdrop-filter: blur(10px);
  }

  .badge-success {
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid var(--success);
  }

  .badge-error {
    background: var(--error-bg);
    color: var(--error);
    border: 1px solid var(--error);
  }

  .badge-warning {
    background: var(--warning-bg);
    color: var(--warning);
    border: 1px solid var(--warning);
  }

  .badge-info {
    background: var(--info-bg);
    color: var(--info);
    border: 1px solid var(--info);
  }

  /* 输入框样式 */
  input, textarea, select {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--text-primary);
    transition: all var(--transition-fast);
    width: 100%;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  /* 模态框样式 */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all var(--transition-normal);
  }

  .modal-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    transform: scale(0.9);
    transition: all var(--transition-normal);
  }

  .modal-overlay.show .modal {
    transform: scale(1);
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .modal-body {
    padding: 24px;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  /* Toast 提示 */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .toast {
    background: var(--bg-secondary);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 280px;
    max-width: 400px;
    box-shadow: var(--shadow-md);
    font-size: 14px;
    animation: slideIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .toast-success {
    border-left: 4px solid var(--success);
    background: var(--success-bg);
  }

  .toast-error {
    border-left: 4px solid var(--error);
    background: var(--error-bg);
  }

  .toast-warning {
    border-left: 4px solid var(--warning);
    background: var(--warning-bg);
  }

  .toast-info {
    border-left: 4px solid var(--info);
    background: var(--info-bg);
  }

  @keyframes slideIn {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* 加载动画 */
  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top: 2px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* 骨架屏 */
  .skeleton {
    background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-tertiary) 50%, var(--bg-secondary) 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
    border-radius: 8px;
  }

  @keyframes loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-secondary);
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .empty-state .title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-primary);
  }

  .empty-state .description {
    font-size: 14px;
    line-height: 1.5;
  }

  /* 响应式设计 */
  @media (max-width: 768px) {
    .container { padding: 16px; }
    header { flex-direction: column; gap: 16px; text-align: center; }
    .status-bar { grid-template-columns: 1fr; }
    .section-header { flex-direction: column; gap: 12px; align-items: flex-start; }
    table { font-size: 12px; }
    th, td { padding: 12px 8px; }
  }

  /* 实时更新指示器 */
  .live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* 表单组 */
  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .form-group textarea {
    min-height: 100px;
    resize: vertical;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* 提示框 */
  .hint-box {
    background: var(--info-bg);
    border: 1px solid var(--info);
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
    font-size: 13px;
    line-height: 1.5;
  }

  .hint-box code {
    background: var(--bg-tertiary);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  /* 进度条 */
  .progress-bar {
    width: 100%;
    height: 8px;
    background: var(--bg-secondary);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: var(--primary-gradient);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
</style>
</head>
<body>
<div class="container">

<header>
  <div>
    <h1>⚡ WebAPI Admin Console</h1>
    <div class="ver">OpenAI 兼容 API · 完整功能版 v1.0</div>
  </div>
  <div class="header-actions">
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span>实时监控</span>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换浅色/深色主题">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>
    <button class="btn" onclick="refreshAll(true)">🔄 刷新</button>
  </div>
</header>

<!-- 状态卡片 -->
<div class="status-bar" id="statusBar">
  <div class="status-chip">
    <div class="label">服务状态</div>
    <div class="value" id="svcStatus">—</div>
  </div>
  <div class="status-chip" id="channelChip">
    <div class="label">渠道健康</div>
    <div class="value" id="channelStatus">—</div>
  </div>
  <div class="status-chip">
    <div class="label">今日请求</div>
    <div class="value" id="todayRequests">—</div>
  </div>
  <div class="status-chip">
    <div class="label">平均响应</div>
    <div class="value" id="avgResponse">—</div>
  </div>
  <div class="status-chip">
    <div class="label">API Key</div>
    <div class="value" id="apiKeyCount">—</div>
  </div>
  <div class="status-chip">
    <div class="label">活跃会话</div>
    <div class="value" id="activeSessions">—</div>
  </div>
</div>

<!-- Provider 状态 -->
<section class="section">
  <div class="section-header">
    <div class="section-title">
      <div class="icon">🔌</div>
      <span>Provider 状态</span>
    </div>
    <div>
      <button class="btn" onclick="checkAllHealth()">🔍 检测全部</button>
      <button class="btn btn-secondary" onclick="exportProviders()">📤 导出配置</button>
    </div>
  </div>
  
  <div class="card">
    <div id="providerTable">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <div class="title">加载中...</div>
        <div class="description">正在获取 Provider 状态信息</div>
      </div>
    </div>
  </div>
</section>

<!-- 可用模型 -->
<section class="section">
  <div class="section-header">
    <div class="section-title">
      <div class="icon">🤖</div>
      <span>可用模型</span>
    </div>
    <div>
      <button class="btn" onclick="refreshModels()">🔄 刷新</button>
      <button class="btn btn-secondary" onclick="exportModels()">📤 导出列表</button>
    </div>
  </div>
  
  <div class="card">
    <div id="modelList">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <div class="title">加载中...</div>
        <div class="description">正在获取可用模型列表</div>
      </div>
    </div>
  </div>
</section>

<!-- API Key 管理 -->
<section class="section">
  <div class="section-header">
    <div class="section-title">
      <div class="icon">🔑</div>
      <span>API Key 管理</span>
    </div>
    <div>
      <button class="btn btn-success" onclick="showCreateKeyModal()">➕ 新建 Key</button>
    </div>
  </div>
  
  <div class="card">
    <div id="apiKeyList">
      <div class="empty-state">
        <div class="icon">🔑</div>
        <div class="title">暂无 API Key</div>
        <div class="description">点击上方按钮创建第一个 API Key</div>
      </div>
    </div>
  </div>
</section>

<!-- 服务器设置 -->
<section class="section">
  <div class="section-header">
    <div class="section-title">
      <div class="icon">⚙️</div>
      <span>服务器设置</span>
    </div>
    <div>
      <button class="btn btn-secondary" onclick="loadServerSettings()">🔄 重载配置</button>
    </div>
  </div>
  
  <div class="card">
    <div class="form-group">
      <label>监听地址</label>
      <input type="text" id="hostInput" placeholder="127.0.0.1" value="127.0.0.1">
    </div>
    <div class="form-group">
      <label>监听端口</label>
      <input type="number" id="portInput" placeholder="8080" min="1" max="65535" value="8080">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>最大并发数</label>
        <input type="number" id="maxConcurrent" placeholder="100" min="1" max="1000" value="100">
      </div>
      <div class="form-group">
        <label>请求超时 (秒)</label>
        <input type="number" id="timeoutInput" placeholder="30" min="1" max="300" value="30">
      </div>
    </div>
    <div class="form-group">
      <label>当前服务地址</label>
      <input type="text" id="currentEndpoint" readonly value="http://127.0.0.1:8080">
    </div>
    <div style="display: flex; gap: 12px; margin-top: 20px;">
      <button class="btn" onclick="saveServerSettings()">💾 保存设置</button>
      <button class="btn btn-secondary" onclick="confirmRestart()">🔄 重启服务</button>
    </div>
  </div>
</section>

<!-- Toast 提示 -->
<div class="toast-container" id="toastContainer"></div>

<!-- Modal 容器 -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="refresh-bar">
  <span id="lastUpdate">等待首次加载...</span>
  <button class="btn" onclick="refreshAll(true)">🔄 刷新数据</button>
</div>

<footer style="text-align: center; padding: 32px 0; color: var(--text-secondary); font-size: 14px; border-top: 1px solid var(--border);">
  WebAPI Admin Console · 完整功能版 · Powered by FastAPI
</footer>

</div>

<script>
// 全局变量
let _refreshBusy = false;
let _refreshInterval = null;
let _realtimeInterval = null;

// Provider 元数据
const PROVIDER_META = {
  deepseek: { name: 'DeepSeek', icon: '🐳' },
  kimi: { name: 'Kimi', icon: '🌙' },
  qwen: { name: '通义千问', icon: '☁️' },
  minimax: { name: 'MiniMax', icon: '🌟' },
  doubao: { name: '豆包', icon: '🫘' },
  yuanbao: { name: '腾讯元宝', icon: '💎' },
  glm: { name: 'GLM', icon: '🤖' },
  coze: { name: 'Coze 扣子', icon: '🤖' },
};

// API 基础路径
const API = '/admin';

// 主题管理
const THEME_KEY = 'webapi-theme-complete';
const THEMES = ['dark', 'light'];

function getStoredTheme() {
  try {
    return localStorage.getItem(THEME_KEY);
  } catch (e) {
    return null;
  }
}

function storeTheme(theme) {
  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch (e) {
    /* localStorage 不可用 */
  }
}

function applyTheme(theme) {
  if (!THEMES.includes(theme)) theme = 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  storeTheme(theme);
  updateThemeIcon(theme);
}

function updateThemeIcon(theme) {
  const toggle = document.getElementById('themeToggle');
  if (!toggle) return;
  toggle.setAttribute('title',
    theme === 'dark' ? '切换到浅色主题' : '切换到深色主题');
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
}

// 初始化主题
(function initTheme() {
  let theme = getStoredTheme();
  if (!theme || !THEMES.includes(theme)) {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      theme = 'light';
    } else {
      theme = 'dark';
    }
  }
  document.documentElement.setAttribute('data-theme', theme);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => updateThemeIcon(theme));
  } else {
    updateThemeIcon(theme);
  }
})();

// Toast 提示
function showToast(message, type = 'info', duration = 3500) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  
  const icon = {
    success: '✅',
    error: '❌',
    warning: '⚠️',
    info: 'ℹ️'
  }[type] || 'ℹ️';
  
  toast.innerHTML = `
    <span style="font-size: 16px;">${icon}</span>
    <span>${message}</span>
  `;
  
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// Modal 弹窗
function showModal(title, content, actions = []) {
  const overlay = document.getElementById('modalOverlay');
  const modal = document.getElementById('modalContent');
  
  const actionsHtml = actions.map(action => 
    `<button class="btn" onclick="${action.onclick}">${action.label}</button>`
  ).join('');
  
  modal.innerHTML = `
    <div class="modal-header">
      <h2 style="margin-bottom: 0; color: var(--text-primary);">${title}</h2>
      <button class="btn btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="margin-bottom: 24px;">${content}</div>
    <div class="modal-footer">${actionsHtml}</div>
  `;
  
  overlay.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// 刷新功能
async function refreshAll(forceCheck = false) {
  if (_refreshBusy) return;
  _refreshBusy = true;

  try {
    await Promise.all([
      loadHealth(),
      loadProviders(forceCheck),
      loadModels(),
      loadApiKeys(),
      loadServerSettings(),
      loadStats()
    ]);
    
    document.getElementById('lastUpdate').textContent = 
      '最后更新: ' + new Date().toLocaleTimeString('zh-CN');
  } catch (e) {
    showToast('刷新失败: ' + e.message, 'error');
  } finally {
    _refreshBusy = false;
  }
}

// 加载统计数据
async function loadStats() {
  try {
    const r = await fetch('/stats');
    const stats = await r.json();
    
    document.getElementById('todayRequests').textContent = stats.total_requests || 0;
    document.getElementById('avgResponse').textContent = 
      stats.avg_response_time ? `${stats.avg_response_time}ms` : '—';
    document.getElementById('apiKeyCount').textContent = 
      (stats.api_key_objects?.length || 0) + (stats.api_keys?.length || 0);
    document.getElementById('activeSessions').textContent = stats.active_connections || 0;
  } catch (e) {
    // 静默失败
  }
}

// 加载健康状态
async function loadHealth() {
  try {
    const r = await fetch('/health');
    document.getElementById('svcStatus').textContent = '● 运行中';
    document.getElementById('svcStatus').className = 'value ok';
  } catch (e) {
    document.getElementById('svcStatus').textContent = '● 离线';
    document.getElementById('svcStatus').className = 'value err';
  }
}

// 加载 Providers
async function loadProviders(forceCheck = false) {
  const tbody = document.getElementById('providerTable');
  
  try {
    const r = await fetch('/admin/providers');
    const d = await r.json();
    const pool = d.pool || {};
    const registered = d.registered || [];
    
    let html = '';
    
    if (registered.length === 0) {
      html = `
        <div class="empty-state">
          <div class="icon">🔌</div>
          <div class="title">暂无 Provider</div>
          <div class="description">请配置 Provider 账号以开始使用</div>
        </div>
      `;
    } else {
      let totalHealthy = 0;
      let totalAccounts = 0;
      
      for (const prov of registered) {
        const accounts = pool[prov] || [];
        const meta = PROVIDER_META[prov] || { name: prov, icon: '🔑' };
        const healthyAccounts = accounts.filter(a => a.healthy).length;
        
        totalHealthy += healthyAccounts;
        totalAccounts += accounts.length;
        
        if (accounts.length === 0) {
          html += `
            <div style="background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <h3 style="margin-bottom: 8px;">${prov} <span style="color: var(--text-secondary); font-size: 14px;">${meta.icon} ${meta.name}</span></h3>
                  <span class="badge badge-warning">未配置账号</span>
                </div>
                <div>
                  <button class="btn btn-sm" onclick="openCredentialModal('${prov}')" style="margin-right: 8px;">✏️ 配置</button>
                  <button class="btn btn-sm" onclick="startLogin('${prov}')" style="background: var(--secondary-gradient);">🔑 登录</button>
                </div>
              </div>
            </div>
          `;
          continue;
        }
        
        for (const acc of accounts) {
          const enabled = acc.enabled !== false;
          const isHealthy = acc.healthy;
          const statusClass = isHealthy ? 'badge-success' : 'badge-error';
          const statusText = isHealthy ? '健康' : '异常';
          
          html += `
            <div style="background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <h3 style="margin-bottom: 8px;">${prov} <span style="color: var(--text-secondary); font-size: 14px;">${meta.icon} ${meta.name}</span></h3>
                  <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
                    <span class="badge ${statusClass}">${statusText}</span>
                    <span style="color: var(--text-secondary); font-size: 12px;">并发: ${acc.concurrent || 0}</span>
                    <span style="color: var(--text-secondary); font-size: 12px;">失败: ${acc.fail_count || 0}</span>
                    ${!enabled ? '<span class="badge badge-error">已禁用</span>' : ''}
                  </div>
                </div>
                <div>
                  <button class="btn btn-sm" onclick="verifyCredential('${prov}')" style="margin-right: 8px;">🔍 验证</button>
                  <button class="btn btn-sm" onclick="openCredentialModal('${prov}')" style="margin-right: 8px;">✏️ 编辑</button>
                  ${enabled ? `<button class="btn btn-sm" onclick="resetAccount('${prov}')" style="background: var(--warning);">🔄 重置</button>` : ''}
                </div>
              </div>
            </div>
          `;
        }
      }
      
      document.getElementById('channelStatus').textContent = `${totalHealthy}/${totalAccounts}`;
      document.getElementById('channelStatus').className = `value ${totalHealthy === totalAccounts && totalAccounts > 0 ? 'ok' : totalHealthy > 0 ? 'warn' : 'err'}`;
    }
    
    tbody.innerHTML = html;
  } catch (e) {
    tbody.innerHTML = `
      <div class="empty-state">
        <div class="icon">❌</div>
        <div class="title">加载失败</div>
        <div class="description">${e.message}</div>
      </div>
    `;
  }
}

// 加载模型列表
async function loadModels() {
  const wrap = document.getElementById('modelList');
  
  try {
    const r = await fetch('/v1/models');
    const d = await r.json();
    const models = d.data || [];
    
    if (models.length === 0) {
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="icon">🤖</div>
          <div class="title">暂无可用模型</div>
          <div class="description">请配置 Provider 账号以获取模型列表</div>
        </div>
      `;
      return;
    }
    
    const modelsHtml = models.map(m => `
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;">
        <div>
          <span style="font-family: monospace; font-size: 14px; color: var(--text-primary);">${m.id}</span>
          ${m.owned_by ? `<span style="color: var(--text-secondary); font-size: 12px; margin-left: 8px;">(${m.owned_by})</span>` : ''}
        </div>
        <button class="btn btn-sm" onclick="copyModel('${m.id}')" style="padding: 6px 12px; font-size: 12px;">📋 复制</button>
      </div>
    `).join('');
    
    wrap.innerHTML = modelsHtml;
  } catch (e) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="icon">❌</div>
        <div class="title">加载失败</div>
        <div class="description">${e.message}</div>
      </div>
    `;
  }
}

// 加载 API Keys
async function loadApiKeys() {
  try {
    const r = await fetch('/admin/api-keys');
    const data = await r.json();
    
    const list = document.getElementById('apiKeyList');
    
    if (data.keys.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔑</div>
          <div class="title">暂无 API Key</div>
          <div class="description">点击上方按钮创建第一个 API Key</div>
        </div>
      `;
      return;
    }
    
    const keysHtml = data.keys.map(k => `
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px;">
        <div>
          <div style="font-weight: 600; margin-bottom: 4px;">${k.name}</div>
          <div style="color: var(--text-secondary); font-size: 12px;">${k.key.substring(0, 8)}...</div>
          ${k.description ? `<div style="color: var(--text-tertiary); font-size: 11px; margin-top: 4px;">${k.description}</div>` : ''}
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <label style="display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" ${k.enabled ? 'checked' : ''} onchange="toggleKey('${k.id}', this.checked)">
            <span style="font-size: 12px;">启用</span>
          </label>
          <button class="btn btn-sm" onclick="regenerateKey('${k.id}', '${k.name}')" style="padding: 6px 12px; font-size: 12px;">🔄</button>
          <button class="btn btn-sm btn-danger" onclick="deleteKey('${k.id}', '${k.name}')" style="padding: 6px 12px; font-size: 12px;">🗑️</button>
        </div>
      </div>
    `).join('');
    
    list.innerHTML = keysHtml;
  } catch (e) {
    document.getElementById('apiKeyList').innerHTML = `
      <div class="empty-state">
        <div class="icon">❌</div>
        <div class="title">加载失败</div>
        <div class="description">${e.message}</div>
      </div>
    `;
  }
}

// 加载服务器设置
async function loadServerSettings() {
  try {
    const r = await fetch('/admin/server/settings');
    const data = await r.json();
    
    document.getElementById('hostInput').value = data.host;
    document.getElementById('portInput').value = data.port;
    document.getElementById('currentEndpoint').value = `http://${data.host}:${data.port}`;
    
    showToast('配置已重载', 'success');
  } catch (e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

// 复制模型
function copyModel(modelId) {
  navigator.clipboard.writeText(modelId).then(() => {
    showToast('模型 ID 已复制', 'success');
  }).catch(() => {
    showToast('复制失败', 'error');
  });
}

// 检测所有渠道
async function checkAllHealth() {
  showToast('开始检测所有渠道...', 'info');
  
  try {
    const r = await fetch('/admin/providers/check', { method: 'POST' });
    const data = await r.json();
    
    showToast(`检测完成: ${data.healthy}/${data.total} 可用`, data.healthy === data.total ? 'success' : 'warning');
    loadProviders();
  } catch (e) {
    showToast('检测失败: ' + e.message, 'error');
  }
}

// 导出功能
function exportProviders() {
  showToast('导出配置功能开发中...', 'info');
}

function exportModels() {
  showToast('导出模型列表功能开发中...', 'info');
}

// 刷新模型
function refreshModels() {
  loadModels();
  showToast('模型列表已刷新', 'success');
}

// 保存服务器设置
function saveServerSettings() {
  const host = document.getElementById('hostInput').value.trim();
  const port = parseInt(document.getElementById('portInput').value);
  
  if (!host || !port) {
    showToast('请填写完整的地址和端口', 'error');
    return;
  }
  
  showToast('设置保存成功', 'success');
}

// 重启服务
function confirmRestart() {
  showModal(
    '确认重启服务',
    '<p>重启服务期间所有连接会断开，约 1-2 秒后恢复。</p>',
    [
      { label: '取消', onclick: 'closeModal()' },
      { label: '确认重启', onclick: 'doRestart()' }
    ]
  );
}

async function doRestart() {
  closeModal();
  showToast('服务正在重启...', 'info');
  
  try {
    await fetch('/admin/server/restart', { method: 'POST' });
    setTimeout(() => {
      refreshAll();
    }, 3000);
  } catch (e) {
    showToast('重启失败: ' + e.message, 'error');
  }
}

// API Key 操作
function showCreateKeyModal() {
  showModal(
    '创建 API Key',
    `
      <div class="form-group">
        <label>名称</label>
        <input type="text" id="newKeyName" placeholder="输入 Key 名称">
      </div>
      <div class="form-group">
        <label>描述（可选）</label>
        <textarea id="newKeyDesc" placeholder="输入 Key 描述" rows="3"></textarea>
      </div>
    `,
    [
      { label: '取消', onclick: 'closeModal()' },
      { label: '创建', onclick: 'createKey()' }
    ]
  );
}

async function createKey() {
  const name = document.getElementById('newKeyName').value.trim();
  const description = document.getElementById('newKeyDesc').value.trim();
  
  if (!name) {
    showToast('请输入 Key 名称', 'error');
    return;
  }
  
  try {
    const r = await fetch('/admin/api-keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description })
    });
    
    if (r.ok) {
      const result = await r.json();
      closeModal();
      showToast('API Key 创建成功', 'success');
      loadApiKeys();
      
      // 显示新创建的 Key
      showModal(
        'API Key 创建成功',
        `<p>新 Key 值：<code>${result.key.key}</code></p>`,
        [
          { label: '复制', onclick: `copyToClipboard('${result.key.key}'); closeModal();` },
          { label: '完成', onclick: 'closeModal();' }
        ]
      );
    }
  } catch (e) {
    showToast('创建失败: ' + e.message, 'error');
  }
}

function toggleKey(keyId, enabled) {
  showToast('切换中...', 'info');
  
  fetch(`/admin/api-keys/${keyId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled })
  }).then(() => {
    showToast(enabled ? '已启用' : '已禁用', 'success');
    loadApiKeys();
  }).catch(e => {
    showToast('操作失败: ' + e.message, 'error');
  });
}

function regenerateKey(keyId, name) {
  if (!confirm(`确定要重新生成 "${name}" 的 Key 吗？旧 Key 将立即失效。`)) {
    return;
  }
  
  showToast('重新生成中...', 'info');
  
  fetch(`/admin/api-keys/${keyId}/regenerate`, { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      showModal(
        'Key 已重新生成',
        `<p>新 Key 值：<code>${data.key.key}</code></p>`,
        [
          { label: '复制', onclick: `copyToClipboard('${data.key.key}'); closeModal();` },
          { label: '完成', onclick: 'closeModal(); loadApiKeys();' }
        ]
      );
    })
    .catch(e => {
      showToast('重新生成失败: ' + e.message, 'error');
    });
}

function deleteKey(keyId, name) {
  if (!confirm(`确定要删除 "${name}" 吗？此操作不可恢复。`)) {
    return;
  }
  
  showToast('删除中...', 'info');
  
  fetch(`/admin/api-keys/${keyId}`, { method: 'DELETE' })
    .then(() => {
      showToast('已删除', 'success');
      loadApiKeys();
    })
    .catch(e => {
      showToast('删除失败: ' + e.message, 'error');
    });
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板', 'success');
  });
}

// 其他功能占位符
function openCredentialModal(provider) {
  showToast('配置功能开发中...', 'info');
}

function startLogin(provider) {
  showToast('自动登录功能开发中...', 'info');
}

function verifyCredential(provider) {
  showToast('验证功能开发中...', 'info');
}

function resetAccount(provider) {
  showToast('重置功能开发中...', 'info');
}

// 实时更新
function startRealtimeUpdates() {
  if (_realtimeInterval) return;
  
  _realtimeInterval = setInterval(() => {
    loadStats();
  }, 5000); // 每5秒更新一次
}

function stopRealtimeUpdates() {
  if (_realtimeInterval) {
    clearInterval(_realtimeInterval);
    _realtimeInterval = null;
  }
}

// 初始化
refreshAll(true);
startRealtimeUpdates();

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.ctrlKey && e.key === 'r') {
    e.preventDefault();
    refreshAll(true);
  }
});

// 页面卸载时清理
window.addEventListener('beforeunload', () => {
  stopRealtimeUpdates();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAPI — 管理面板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
:root{--bg:#0f1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d2991d;--text:#e1e4e8;--text2:#8b949e}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:18px;font-weight:600;color:var(--accent)}
header .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
header .status-dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
header .status-dot.offline{background:var(--red)}
nav{display:flex;gap:4px;background:var(--bg2);padding:8px 24px;border-bottom:1px solid var(--border);position:sticky;top:53px;z-index:99}
nav button{padding:6px 16px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;transition:all .15s}
nav button:hover{color:var(--text);background:var(--bg3)}
nav button.active{color:var(--accent);background:var(--bg3);border-color:var(--border)}
main{padding:20px 24px;max-width:1200px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .icon{font-size:18px}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--text);cursor:pointer;font-size:12px;transition:all .15s;white-space:nowrap}
.btn:hover{background:#30363d;border-color:#484f58}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#4090e0}
.btn-danger{color:var(--red);border-color:#f8514966}
.btn-danger:hover{background:#da363333;border-color:var(--red)}
.btn-success{color:var(--green);border-color:#3fb95066}
.btn-success:hover{background:#23863633;border-color:var(--green)}
.btn-sm{padding:3px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px;width:100%;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block}
.form-group{margin-bottom:12px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-success{background:#23863633;color:var(--green)}
.badge-danger{background:#da363333;color:var(--red)}
.badge-warning{background:#9e6a0333;color:var(--yellow)}
.badge-info{background:#1f6feb33;color:var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .value{font-size:28px;font-weight:700;margin:4px 0}
.stat-card .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.provider-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.provider-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.provider-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.provider-header .name{font-size:15px;font-weight:600}
.provider-header .meta{font-size:11px;color:var(--text2)}
.provider-body{padding:12px 16px}
.account-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:var(--bg);font-size:12px}
.account-row .acc-name{font-weight:500}
.account-row .acc-status{display:flex;align-items:center;gap:4px}
.account-row .actions{display:flex;gap:4px}
.empty-state{text-align:center;padding:24px;color:var(--text2);font-size:13px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:15px}
.modal-body{padding:16px}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;top:16px;right:16px;padding:10px 18px;border-radius:8px;font-size:13px;z-index:2000;animation:slideIn .3s ease;max-width:400px}
.toast-success{background:#238636;color:#fff}
.toast-error{background:#da3633;color:#fff}
.toast-info{background:#1f6feb;color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.hint-box{background:#1f6feb10;border:1px solid #1f6feb33;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:12px;line-height:1.6}
.hint-box code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:11px}
.hint-box a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
.provider-actions{display:flex;gap:6px;padding:8px 16px 14px}
</style>
</head>
<body>

<header>
  <h1>⚡ WebAPI 管理面板</h1>
  <div style="display:flex;align-items:center;gap:12px;font-size:12px">
    <span id="serverStatus"><span class="status-dot online"></span>运行中</span>
    <span id="uptime" style="color:var(--text2)"></span>
  </div>
</header>

<nav>
  <button class="active" onclick="switchTab('overview')">📊 概览</button>
  <button onclick="switchTab('providers')">🔌 渠道管理</button>
  <button onclick="switchTab('settings')">⚙️ 设置</button>
</nav>

<main>
<!-- ===== OVERVIEW TAB ===== -->
<div id="tab-overview">
  <div class="stats-grid" id="statsGrid"></div>

  <div class="card" style="margin-top:16px">
    <h3><span class="icon">🔌</span>渠道状态</h3>
    <div style="display:flex;gap:12px;margin-bottom:12px">
      <button class="btn btn-primary" onclick="checkAllHealth()">🔄 检测全部渠道</button>
      <button class="btn btn-danger" onclick="clearAllSessions()">🗑️ 清除所有对话</button>
    </div>
    <div id="providerStatusGrid" class="provider-grid"></div>
  </div>
</div>

<!-- ===== PROVIDERS TAB ===== -->
<div id="tab-providers" class="hidden">
  <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
    <select id="providerFilter" onchange="renderProviders()" style="width:auto;min-width:200px">
      <option value="all">全部渠道</option>
    </select>
    <button class="btn btn-primary" onclick="showAddAccountModal()">➕ 添加账号</button>
    <button class="btn btn-danger" onclick="clearAllSessions()">🗑️ 清除所有对话</button>
  </div>
  <div id="providersDetail"></div>
</div>

<!-- ===== SETTINGS TAB ===== -->
<div id="tab-settings" class="hidden">
  <div class="card">
    <h3><span class="icon">⚙️</span>服务器配置</h3>
    <div class="form-row">
      <div class="form-group">
        <label>主机地址</label>
        <input id="cfgHost" disabled>
      </div>
      <div class="form-group">
        <label>端口</label>
        <input id="cfgPort" disabled>
      </div>
    </div>
  </div>
  <div class="card">
    <h3><span class="icon">🔑</span>API 密钥管理</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px">管理客户端访问 WebAPI 使用的 API Key</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="reloadConfig()">🔄 重新加载配置</button>
    </div>
  </div>
</div>
</main>

<!-- ===== MODALS ===== -->
<div id="accountModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">添加账号</h3>
      <button class="btn btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>渠道 *</label>
        <select id="accProvider"></select>
      </div>
      <div class="form-group">
        <label>账号名称 *</label>
        <input id="accName" placeholder="如：我的主号、备用号">
      </div>
      <div class="form-group">
        <label>Token (Bearer/JWT)</label>
        <textarea id="accToken" rows="3" placeholder="从浏览器 DevTools 复制"></textarea>
      </div>
      <div class="form-group">
        <label>Cookie</label>
        <textarea id="accCookie" rows="2" placeholder="完整 Cookie 字符串"></textarea>
      </div>
      <div class="form-group">
        <label>Real User ID</label>
        <input id="accUserId" placeholder="部分 Provider 需要">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>最大并发</label>
          <input id="accConcurrent" type="number" value="5" min="1" max="20">
        </div>
      </div>
      <div class="form-group">
        <label>模型列表（每行一个，留空使用默认）</label>
        <textarea id="accModels" rows="2" placeholder="deepseek-v4&#10;deepseek-v4-flash"></textarea>
      </div>
      <div id="credentialHint" class="hint-box"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="btnSaveAccount">保存</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
// ===== STATE =====
let currentTab = 'overview';
let editAccount = null;
const API = '/admin';

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(err.detail || `HTTP ${r.status}`);
  }
  return r.json();
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ===== TAB SWITCHING =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.textContent.includes(
    tab === 'overview' ? '概览' : tab === 'providers' ? '渠道' : '设置'
  )));
  ['overview', 'providers', 'settings'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
  });
  if (tab === 'overview') loadOverview();
  if (tab === 'providers') renderProviders();
  if (tab === 'settings') loadSettings();
}

// ===== OVERVIEW =====
async function loadOverview() {
  try {
    const config = await api('GET', '/config');
    const stats = await api('GET', '/stats');
    const pool = await api('GET', '/pool');

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card">
        <div class="value" style="color:var(--accent)">${pool.providers?.length || 0}</div>
        <div class="label">已配置渠道</div>
      </div>
      <div class="stat-card">
        <div class="value" style="color:var(--green)">${stats.total_requests || 0}</div>
        <div class="label">总请求数</div>
      </div>
      <div class="stat-card">
        <div class="value">${(stats.uptime_seconds || 0).toFixed(0)}s</div>
        <div class="label">运行时间</div>
      </div>
      <div class="stat-card">
        <div class="value" style="color:${(stats.error_requests || 0) > 0 ? 'var(--red)' : 'var(--green)'}">${stats.error_requests || 0}</div>
        <div class="label">错误请求</div>
      </div>
      <div class="stat-card">
        <div class="value" style="color:var(--yellow)">${pool.accounts?.reduce((s,a) => s + (a.healthy ? 1 : 0), 0) || 0}</div>
        <div class="label">健康账号</div>
      </div>
    `;

    // Build provider status from pool
    const providerMap = {};
    (pool.providers || []).forEach(p => {
      const name = typeof p === 'string' ? p : p.name || p.type || 'unknown';
      if (!providerMap[name]) providerMap[name] = { healthy: 0, unhealthy: 0, total: 0 };
    });
    (pool.accounts || []).forEach(a => {
      const pn = a.provider || a.provider_type || 'unknown';
      if (!providerMap[pn]) providerMap[pn] = { healthy: 0, unhealthy: 0, total: 0 };
      providerMap[pn].total++;
      if (a.healthy) providerMap[pn].healthy++; else providerMap[pn].unhealthy++;
    });

    document.getElementById('providerStatusGrid').innerHTML = Object.entries(providerMap).map(([name, s]) => `
      <div class="provider-card">
        <div class="provider-header">
          <span class="name">${name}</span>
          <span class="badge ${s.healthy === s.total && s.total > 0 ? 'badge-success' : s.healthy > 0 ? 'badge-warning' : 'badge-danger'}">
            ${s.healthy}/${s.total} 正常
          </span>
        </div>
        <div class="provider-body">
          <div style="font-size:11px;color:var(--text2)">健康检查: ${s.healthy} 通过, ${s.unhealthy} 失败</div>
        </div>
      </div>
    `).join('') || '<div class="empty-state">暂无渠道数据</div>';
  } catch (e) {
    toast('加载概览失败: ' + e.message, 'error');
  }
}

// ===== PROVIDER MANAGEMENT =====
async function renderProviders() {
  const filter = document.getElementById('providerFilter').value;
  try {
    const data = await api('GET', '/providers');
    const registered = data.registered || [];
    
    // Update filter dropdown
    const sel = document.getElementById('providerFilter');
    sel.innerHTML = '<option value="all">全部渠道</option>' + registered.map(p => `<option value="${p}" ${filter === p ? 'selected' : ''}>${p}</option>`).join('');

    // Load accounts for each provider
    const providers = filter === 'all' ? registered : [filter];
    let html = '';

    for (const provider of providers) {
      let accounts = [];
      try {
        const accData = await api('GET', `/providers/${provider}/accounts`);
        accounts = accData.accounts || [];
      } catch (e) { /* no accounts yet */ }

      html += `
      <div class="provider-card" style="margin-bottom:16px">
        <div class="provider-header">
          <div>
            <span class="name">${provider}</span>
            <span class="meta" style="margin-left:8px">${accounts.length} 个账号</span>
          </div>
          <span class="badge ${accounts.length > 0 ? 'badge-info' : 'badge-warning'}">${accounts.length > 0 ? '已配置' : '未配置'}</span>
        </div>
        <div class="provider-body">
          ${accounts.length === 0 ? '<div class="empty-state">暂无账号，点击下方按钮添加</div>' : accounts.map(acc => `
            <div class="account-row">
              <div>
                <span class="acc-name">${acc.name}</span>
                ${!acc.enabled ? '<span class="badge badge-danger" style="margin-left:6px">已禁用</span>' : ''}
                <span style="color:var(--text2);margin-left:8px;font-size:11px">${acc.has_token ? 'Token ✓' : 'Token ✗'} · ${acc.has_cookie ? 'Cookie ✓' : 'Cookie ✗'}</span>
              </div>
              <div class="actions">
                <button class="btn btn-sm btn-success" onclick="validateAccount('${provider}','${acc.name}')" title="验证凭证">🔍</button>
                <button class="btn btn-sm" onclick="editAccountForm('${provider}','${acc.name}')" title="编辑">✏️</button>
                <button class="btn btn-sm btn-danger" onclick="deleteAccount('${provider}','${acc.name}')" title="删除">🗑️</button>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="provider-actions">
          <button class="btn btn-primary btn-sm" onclick="showAddAccountModal('${provider}')">➕ 添加账号</button>
          <button class="btn btn-sm btn-success" onclick="validateAllAccounts('${provider}')">🔍 验证全部</button>
          <button class="btn btn-sm btn-danger" onclick="clearProviderSessions('${provider}')">🗑️ 清除对话</button>
        </div>
      </div>`;
    }

    document.getElementById('providersDetail').innerHTML = html || '<div class="empty-state">暂无已注册渠道</div>';
  } catch (e) {
    document.getElementById('providersDetail').innerHTML = `<div class="empty-state">加载失败: ${e.message}</div>`;
    toast('加载渠道失败: ' + e.message, 'error');
  }
}

// ===== ACCOUNT CRUD =====
function showAddAccountModal(provider) {
  editAccount = null;
  document.getElementById('modalTitle').textContent = '添加账号';
  document.getElementById('btnSaveAccount').textContent = '添加';
  document.getElementById('accName').value = '';
  document.getElementById('accToken').value = '';
  document.getElementById('accCookie').value = '';
  document.getElementById('accUserId').value = '';
  document.getElementById('accConcurrent').value = '5';
  document.getElementById('accModels').value = '';
  
  const sel = document.getElementById('accProvider');
  if (provider) {
    sel.innerHTML = `<option value="${provider}">${provider}</option>`;
    sel.disabled = true;
  } else {
    loadProviderSelect(sel);
    sel.disabled = false;
  }
  updateCredentialHint();
  document.getElementById('accountModal').classList.remove('hidden');
}

async function editAccountForm(provider, name) {
  try {
    const data = await api('GET', `/providers/${provider}/accounts`);
    const acc = (data.accounts || []).find(a => a.name === name);
    if (!acc) { toast('账号未找到', 'error'); return; }

    editAccount = { provider, name };
    document.getElementById('modalTitle').textContent = '编辑账号';
    document.getElementById('btnSaveAccount').textContent = '保存';
    document.getElementById('accName').value = acc.name;
    document.getElementById('accToken').value = '';
    document.getElementById('accCookie').value = '';
    document.getElementById('accUserId').value = acc.user_id_preview || '';
    document.getElementById('accConcurrent').value = acc.max_concurrent || 5;
    document.getElementById('accModels').value = (acc.models || []).join('\n');

    const sel = document.getElementById('accProvider');
    sel.innerHTML = `<option value="${provider}">${provider}</option>`;
    sel.disabled = true;
    updateCredentialHint();
    document.getElementById('accountModal').classList.remove('hidden');
  } catch (e) {
    toast('加载账号失败: ' + e.message, 'error');
  }
}

async function saveAccount() {
  const provider = document.getElementById('accProvider').value;
  const name = document.getElementById('accName').value.trim();
  const token = document.getElementById('accToken').value.trim();
  const cookie = document.getElementById('accCookie').value.trim();
  const userId = document.getElementById('accUserId').value.trim();
  const concurrent = parseInt(document.getElementById('accConcurrent').value) || 5;
  const models = document.getElementById('accModels').value.split('\n').map(s => s.trim()).filter(Boolean);

  if (!name) { toast('请输入账号名称', 'error'); return; }
  if (!token && !cookie) { toast('至少需要提供 Token 或 Cookie', 'error'); return; }

  try {
    if (editAccount) {
      await api('PUT', `/providers/${provider}/accounts/${editAccount.name}`, {
        name: name !== editAccount.name ? name : undefined,
        token, cookie, user_id: userId, models, max_concurrent: concurrent
      });
      toast(`账号 '${name}' 已更新`, 'success');
    } else {
      await api('POST', `/providers/${provider}/accounts`, {
        name, token, cookie, user_id: userId, models, max_concurrent: concurrent
      });
      toast(`账号 '${name}' 已创建`, 'success');
    }
    closeModal();
    renderProviders();
  } catch (e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

async function deleteAccount(provider, name) {
  if (!confirm(`确认删除账号 '${name}'？此操作不可撤销。`)) return;
  try {
    await api('DELETE', `/providers/${provider}/accounts/${name}`);
    toast(`账号 '${name}' 已删除`, 'success');
    renderProviders();
  } catch (e) {
    toast('删除失败: ' + e.message, 'error');
  }
}

function closeModal() {
  document.getElementById('accountModal').classList.add('hidden');
  editAccount = null;
}

// ===== VALIDATION =====
async function validateAccount(provider, name) {
  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const result = await api('POST', `/providers/${provider}/accounts/${name}/validate`);
    if (result.valid) {
      toast(`✅ ${provider}/${name} 凭证有效 (${result.latency_ms}ms)`, 'success');
    } else {
      toast(`❌ ${provider}/${name} 凭证无效: ${result.error}`, 'error');
    }
  } catch (e) {
    toast(`验证失败: ${e.message}`, 'error');
  }
  if (btn) { btn.disabled = false; btn.textContent = '🔍'; }
}

async function validateAllAccounts(provider) {
  try {
    const data = await api('POST', `/providers/${provider}/validate-all`);
    toast(`${provider}: ${data.healthy}/${data.total} 账号通过验证`, data.healthy === data.total ? 'success' : 'error');
    renderProviders();
  } catch (e) {
    toast('批量验证失败: ' + e.message, 'error');
  }
}

async function checkAllHealth() {
  try {
    const data = await api('POST', '/providers/check');
    toast(data.message, data.unhealthy > 0 ? 'error' : 'success');
    loadOverview();
  } catch (e) {
    toast('检测失败: ' + e.message, 'error');
  }
}

// ===== SESSION CLEARING =====
async function clearAllSessions() {
  if (!confirm('确认清除所有对话记录？此操作不可撤销。')) return;
  try {
    const data = await api('POST', '/sessions/clear');
    toast(data.message, 'success');
  } catch (e) {
    toast('清除失败: ' + e.message, 'error');
  }
}

async function clearProviderSessions(provider) {
  if (!confirm(`确认清除 ${provider} 的所有对话记录？`)) return;
  try {
    const data = await api('DELETE', `/providers/${provider}/sessions`);
    toast(data.message, 'success');
  } catch (e) {
    toast('清除失败: ' + e.message, 'error');
  }
}

// ===== SETTINGS =====
async function loadSettings() {
  try {
    const config = await api('GET', '/config');
    document.getElementById('cfgHost').value = config.server?.host || '127.0.0.1';
    document.getElementById('cfgPort').value = config.server?.port || '8080';
  } catch (e) {
    toast('加载设置失败: ' + e.message, 'error');
  }
}

async function reloadConfig() {
  try {
    await api('POST', '/config/reload');
    toast('配置已重新加载', 'success');
  } catch (e) {
    toast('重新加载失败: ' + e.message, 'error');
  }
}

// ===== HELPERS =====
function loadProviderSelect(sel) {
  fetch(API + '/providers')
    .then(r => r.json())
    .then(data => {
      sel.innerHTML = (data.registered || []).map(p => `<option value="${p}">${p}</option>`).join('');
      updateCredentialHint();
    })
    .catch(() => {});
}

function updateCredentialHint() {
  const provider = document.getElementById('accProvider').value;
  const hints = {
    deepseek: { primary: 'token', desc: '从浏览器 DevTools → Application → Local Storage → userToken 复制' },
    kimi: { primary: 'token', desc: '从浏览器 DevTools → Application → Local Storage → access_token 或 refresh_token 复制' },
    qwen: { primary: 'token', desc: '从浏览器 Cookie → tongyi_sso_ticket 复制，或提供完整 Cookie 字符串' },
    minimax: { primary: 'token', desc: '从浏览器 Network → Authorization Header 复制 JWT。还需要填写 Real User ID' },
    doubao: { primary: 'cookie', desc: '从浏览器 DevTools → Application → Cookies → doubao.com 复制全部 Cookie' },
    yuanbao: { primary: 'cookie', desc: '从浏览器 DevTools → Application → Cookies → yuanbao.tencent.com 复制全部 Cookie' },
    glm: { primary: 'cookie', desc: '从浏览器 Cookie → chatglm_refresh_token 复制' },
    coze: { primary: 'token', desc: '从 Coze API 设置页面获取 API Key' },
  };
  const hint = hints[provider] || { primary: 'token', desc: '填写 Token 或 Cookie 即可' };
  document.getElementById('credentialHint').innerHTML = `
    <strong>💡 凭证获取提示</strong><br>
    主要字段: <code>${hint.primary}</code><br>
    ${hint.desc}
  `;
}

// ===== UPTIME =====
setInterval(async () => {
  try {
    const stats = await api('GET', '/stats');
    const secs = stats.uptime_seconds || 0;
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = Math.floor(secs % 60);
    document.getElementById('uptime').textContent = `运行 ${h}h ${m}m ${s}s`;
  } catch (e) {}
}, 30000);

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  loadOverview();
  // Load provider dropdown for modal
  loadProviderSelect(document.getElementById('accProvider'));
  document.getElementById('accProvider').addEventListener('change', updateCredentialHint);
  document.getElementById('btnSaveAccount').addEventListener('click', saveAccount);
  // Close modal on overlay click
  document.getElementById('accountModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('accountModal')) closeModal();
  });
  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
});
</script>
</body>
</html>

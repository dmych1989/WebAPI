<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAPI Admin 启动中...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #0f0f14 0%, #1a1a24 100%);
  color: #ffffff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid rgba(102, 126, 234, 0.2);
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
h1 { font-size: 22px; font-weight: 600; }
p { color: #a0a0b0; font-size: 14px; }
a { color: #667eea; text-decoration: none; }
</style>
</head>
<body>
<div class="spinner"></div>
<h1>🛠️ WebAPI Admin Console</h1>
<p>正在加载管理控制台...</p>
<p>如未自动跳转, 请 <a href="/spa-app.html#settings">点击这里</a></p>
<script>
setTimeout(() => { window.location.replace('/spa-app.html'); }, 600);
</script>
</body>
</html>
